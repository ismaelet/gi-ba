name: gieba
services:
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    volumes:
      - ./app:/var/www/html
    expose:
      - 9000
    environment:
      APP_NAME: "Gi&Ba"
      APP_FULL_NAME: "GI&BA di Shipping Dog SNC"
      APP_DESCRIPTION: "Abbigliamento e accessori personalizzati"
      APP_SHORT_DESCRIPTION: "Abbigliamento e accessori personalizzati"

      APP_LOCALE: it
      APP_FALLBACK_LOCALE: en
      APP_URL: http://localhost:8080
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: REDACTED_LARAVEL_APP_KEY

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: project_database
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      MAIL_MAILER: smtp
      MAIL_HOST: "smtp.titan.email"
      MAIL_PORT: 465
      MAIL_USERNAME: no-reply@giebapromotion.com
      MAIL_PASSWORD: "REDACTED_SMTP_PASSWORD"
      MAIL_ENCRYPTION: SSL
      MAIL_FROM_ADDRESS: no-reply@giebapromotion.com
      MAIL_FROM_NAME: ${APP_NAME}

      SENTRY_LARAVEL_DSN: null
      SENTRY_TRACES_SAMPLE_RATE: 0
    depends_on:
      - db

  web:
    image: nginx:alpine
    ports:
      - 8080:80
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  vite:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - ./app:/var/www/html
    command: /bin/bash -c 'npm install && npm run dev'
    environment:
      VITE_SERVER_HOST: true
      VITE_SERVER_ORIGIN: http://localhost:5173
    ports:
      - 5173:5173
    depends_on:
      - app

  db:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: project_database
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3306:3306

volumes:
  db:
